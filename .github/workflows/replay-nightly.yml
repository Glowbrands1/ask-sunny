name: Replay pack (nightly)

# The replay pack (src/app/api/chat/replay-pack) runs every reported chat
# through the real chat route with production's flags
# (src/config/production-flags.json). CI runs it on every pull request; this
# runs it on main every night as well, so a regression that lands between
# reports — a dependency, a merge order, a flag file update — is seen the next
# morning, not when a manager meets it. On failure it opens (or comments on)
# one issue labelled "replay-pack". It reads nothing from production: no
# tokens, no secrets.
on:
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Replay pack
        run: npx vitest run src/app/api/chat/replay-pack/
      - name: Report a regression
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Replay pack failed on main";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The nightly replay pack failed on main: ${run}\n\nA case that was "fixed" no longer holds, an "open" case now holds (move it to fixed), or the flag file names an unknown flag. See the run's log.`;
            // The label may not exist yet: create it once; "already exists" (422) and any other failure are fine.
            try {
              await github.rest.issues.createLabel({ ...context.repo, name: "replay-pack", color: "d93f0b", description: "The nightly replay pack failed on main" });
            } catch (error) {
              core.info(`replay-pack label: ${error.status === 422 ? "already exists" : error.message}`);
            }
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "replay-pack" });
            if (open.length > 0) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ["replay-pack"] });
            }
