name: CI

# Runs on every pull request and every push to main, so a change that breaks
# lint, the typecheck or a test shows a red ✗ on the pull request before it is
# merged — not after a manager finds it in production.
#
# merge_group: GitHub's merge queue (Pau, 7 Nov 2026). The queue tests each pull
# request on top of main and the pull requests ahead of it, on a temporary
# gh-readonly-queue/main/… branch, and merges only when the required checks
# ("checks" and "eval", below) pass there. They are the same jobs with the same
# names; neither reads pull-request-only context, so they run unchanged.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request replaces its older run; runs on main
# always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # THE TESTS RUN IN PARALLEL JOBS (QA, 7 Nov 2026). As one "npm test" step they
  # took ~21 of the job's 30 minutes on CI and a run was cancelled at the limit:
  # the "unit" project took ~9 min, then the "flags-off-parity" project (its own
  # vitest project, groupOrder 1, which re-runs the chat and form suites with every
  # new flag off) took ~12 min after it. Together they are exactly what
  # "npm test" (`vitest run`, both projects) runs — nothing skipped — but side by
  # side, so the slowest job is ~12 min plus setup.
  lint-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit -p .

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (vitest project "unit")
        run: npx vitest run --project unit

  # THE PARITY CHILDREN SIDE BY SIDE (QA, 13 Nov 2026). The project's children (the
  # chat and form suites re-run with every new flag off) ran one after another in
  # one job, and the job was cancelled at its 30-minute limit (ask-sunny#930, no
  # failing test). Each child is now its own matrix job: PARITY_ONLY=<index in
  # CHILDREN> runs that child alone; "guards" runs the file's other tests and no
  # child. Together they are exactly what the one job ran. The matrix list must
  # name every child: `flags-off-parity.test.ts` checks it against CHILDREN.
  flags-off-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        parity-child: [guards, 0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (vitest project "flags-off-parity", ${{ matrix.parity-child }})
        env:
          PARITY_ONLY: ${{ matrix.parity-child }}
        run: |
          if [ "$PARITY_ONLY" = "guards" ]; then
            npx vitest run --project flags-off-parity -t '^(?!.*passes the suites whose expectations are already on main)'
          else
            npx vitest run --project flags-off-parity -t 'passes the suites whose expectations are already on main'
          fi

  # "checks" is the REQUIRED CHECK (branch protection and the merge queue name
  # it). It passes only when every job above succeeded: a failed, cancelled or
  # skipped job fails it (a skipped required job would otherwise count as a pass).
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint-typecheck, unit-tests, flags-off-parity]
    if: always()
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ needs.lint-typecheck.result }} ${{ needs.unit-tests.result }} ${{ needs.flags-off-parity.result }}
        run: |
          echo "lint-typecheck, unit-tests, flags-off-parity: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A job did not succeed ($result)."
              exit 1
            fi
          done

  # The replay eval (evals/): every replay case through the real chat route,
  # flags off (must equal evals/baseline.json) and with the step's flags on
  # (may break no case, at most 25% slower). Local and deterministic: an
  # in-memory database and neutral model stand-ins, no secrets, no network.
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Replay eval
        run: npm run eval
