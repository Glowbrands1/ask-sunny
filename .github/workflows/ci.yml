name: CI

# Runs on every pull request and every push to main, so a change that breaks
# lint, the typecheck or a test shows a red ✗ on the pull request before it is
# merged — not after a manager finds it in production.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Tests
        run: npm test
