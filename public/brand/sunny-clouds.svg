<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="560" height="420" viewBox="0 0 560 420">
  <!-- Ask Sunny's repeating clay clouds: puffy, lit from above, with a soft
       warm cast shadow. Tiled behind the app by `.cloud-pattern`. Every cloud
       sits fully inside the tile, so the repeat never cuts one in half. -->
  <defs>
    <linearGradient id="puff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".62" stop-color="#fdf3ec"/>
      <stop offset="1" stop-color="#f2d9c8"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <g id="cloud">
      <!-- cast shadow -->
      <g fill="#c99a7c" opacity=".32" filter="url(#soft)" transform="translate(0 9)">
        <ellipse cx="60" cy="52" rx="52" ry="16"/>
        <circle cx="38" cy="40" r="19"/><circle cx="63" cy="31" r="25"/><circle cx="88" cy="42" r="17"/>
      </g>
      <!-- the puff -->
      <g fill="url(#puff)">
        <ellipse cx="60" cy="50" rx="52" ry="17"/>
        <circle cx="38" cy="40" r="19"/><circle cx="63" cy="31" r="25"/><circle cx="88" cy="42" r="17"/>
      </g>
      <!-- clay highlight -->
      <ellipse cx="54" cy="18" rx="11" ry="5" fill="#ffffff" opacity=".9" transform="rotate(-18 54 18)"/>
      <ellipse cx="31" cy="30" rx="6" ry="3" fill="#ffffff" opacity=".8" transform="rotate(-25 31 30)"/>
    </g>
  </defs>
  <use xlink:href="#cloud" href="#cloud" transform="translate(28 34)"/>
  <use xlink:href="#cloud" href="#cloud" transform="translate(338 22) scale(.68)"/>
  <use xlink:href="#cloud" href="#cloud" transform="translate(190 160) scale(1.3)"/>
  <use xlink:href="#cloud" href="#cloud" transform="translate(410 250) scale(.9)"/>
  <use xlink:href="#cloud" href="#cloud" transform="translate(36 290) scale(.62)"/>
  <use xlink:href="#cloud" href="#cloud" transform="translate(250 352) scale(.48)"/>
</svg>
